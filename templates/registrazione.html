{% extends "base.html" %}

{% block title %}
  TripCrew
{% endblock %}

{% block content %}
<div class="container mt-4 mb-5 text-center">

  <h1>Registrazione</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    
    <label for="username">Nome utente</label><br>
    <input type="text" id="username" name="username" value="{{ username_inserito | default('') }}"
            autocomplete="username" autocapitalize="none" required>

    <span id="username-feedback" style="color: red; display: none;">Username già in uso!</span>

      <script>
      var timerUsername;
      document.getElementById('username').addEventListener('input', function() {
          var username = this.value;
          var feedback = document.getElementById('username-feedback');
          var btnRegister = document.getElementById('btn-register');
          clearTimeout(timerUsername);

          if (username.length <= 2) {
              feedback.style.display = 'none';
              btnRegister.disabled = false;
              return;
          }

          // aspetta che l'utente smetta di scrivere prima di interrogare il server
          timerUsername = setTimeout(function() {
              fetch('/check_username', {
                  method: 'POST',
                  headers: {
                      'Content-Type': 'application/json',
                      'X-CSRFToken': '{{ csrf_token() }}'
                  },
                  body: JSON.stringify({ username: username })
              })
              .then(function(response) { return response.json(); })
              .then(function(data) {
                  feedback.style.display = data.exists ? 'block' : 'none';
                  btnRegister.disabled = !!data.exists;
              })
              .catch(function(error) { console.error('Errore:', error); });
          }, 400);
      });
      </script>

      <br><br>

      <label for="email">Email</label><br>
      <input type="email" id="email" name="email" value="{{ email_inserita | default('') }}"
             autocomplete="email" required><br><br>

      <label for="password">Password <span class="text-muted fw-normal">(almeno 8 caratteri)</span></label><br>
      <div class="password-field">
        <input type="password" id="password" name="password"
               autocomplete="new-password" minlength="8" required>
        <button type="button" class="password-toggle" aria-label="Mostra password">👁️</button>
      </div>

      <!-- Aggiunto id="btn-register" qui -->
      <button type="submit" id="btn-register">Registrati</button>
  </form>
    <p class="mt-4 mb-2">oppure</p>
    <a href="{{ url_for('login_google') }}" class="btn btn-outline-secondary">Continua con Google</a>
</div>

{% endblock %}
